{% macro option(field, value, label) -%}
<option value="{{ value }}"{% if request.form.get(field) == value|string %} selected{% endif %}>{{ label }}</option>
{%- endmacro %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Hotel Reservation Cancellation</title>
</head>
<body>
    <div class="container">
        <h2>Hotel Reservation Cancellation</h2>
        <form method="POST">

            <div class="form-group">
                <label for="lead_time">Lead Time</label>
                <input type="number" id="lead_time" name="lead_time" value="{{ request.form.get('lead_time', '') }}" required>
            </div>

            <div class="form-group">
                <label for="num_of_special_request">Number of Special Requests</label>
                <input type="number" id="num_of_special_request" name="num_of_special_request" value="{{ request.form.get('num_of_special_request', '') }}" required>
            </div>

            <div class="form-group">
                <label for="avg_price_per_room">Average Price Per Room</label>
                <input type="number" id="avg_price_per_room" name="avg_price_per_room" step="0.01" value="{{ request.form.get('avg_price_per_room', '') }}" required>
            </div>

            <div class="form-group">
                <label for="arrival_month">Arrival Month</label>
                <select id="arrival_month" name="arrival_month" required>
                    {{ option('arrival_month', 1, 'January') }}
                    {{ option('arrival_month', 2, 'February') }}
                    {{ option('arrival_month', 3, 'March') }}
                    {{ option('arrival_month', 4, 'April') }}
                    {{ option('arrival_month', 5, 'May') }}
                    {{ option('arrival_month', 6, 'June') }}
                    {{ option('arrival_month', 7, 'July') }}
                    {{ option('arrival_month', 8, 'August') }}
                    {{ option('arrival_month', 9, 'September') }}
                    {{ option('arrival_month', 10, 'October') }}
                    {{ option('arrival_month', 11, 'November') }}
                    {{ option('arrival_month', 12, 'December') }}
                </select>
            </div>

            <div class="form-group">
                <label for="arrival_date">Arrival Date</label>
                <select id="arrival_date" name="arrival_date" required>
                    {% for day in range(1, 32) %}
                        {{ option('arrival_date', day, day) }}
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="market_segment_type">Market Segment Type</label>
                <select id="market_segment_type" name="market_segment_type" required>
                    {{ option('market_segment_type', 0, 'Aviation') }}
                    {{ option('market_segment_type', 1, 'Complementary') }}
                    {{ option('market_segment_type', 2, 'Corporate') }}
                    {{ option('market_segment_type', 3, 'Offline') }}
                    {{ option('market_segment_type', 4, 'Online') }}
                </select>
            </div>

            <div class="form-group">
                <label for="num_of_week_nights">Number of Weeknights</label>
                <input type="number" id="num_of_week_nights" name="num_of_week_nights" value="{{ request.form.get('num_of_week_nights', '') }}" required>
            </div>

            <div class="form-group">
                <label for="num_of_weekend_nights">Number of Weekend Nights</label>
                <input type="number" id="num_of_weekend_nights" name="num_of_weekend_nights" value="{{ request.form.get('num_of_weekend_nights', '') }}" required>
            </div>

            <div class="form-group">
                <label for="type_of_meal_plan">Type of Meal Plan</label>
                <select id="type_of_meal_plan" name="type_of_meal_plan" required>
                    {{ option('type_of_meal_plan', 0, 'Meal Plan 1') }}
                    {{ option('type_of_meal_plan', 1, 'Meal Plan 2') }}
                    {{ option('type_of_meal_plan', 2, 'Meal Plan 3') }}
                    {{ option('type_of_meal_plan', 3, 'Not Selected') }}
                </select>
            </div>

            <div class="form-group">
                <label for="room_type_reserved">Room Type Reserved</label>
                <select id="room_type_reserved" name="room_type_reserved" required>
                    {{ option('room_type_reserved', 0, 'Room Type 1') }}
                    {{ option('room_type_reserved', 1, 'Room Type 2') }}
                    {{ option('room_type_reserved', 2, 'Room Type 3') }}
                    {{ option('room_type_reserved', 3, 'Room Type 4') }}
                    {{ option('room_type_reserved', 4, 'Room Type 5') }}
                    {{ option('room_type_reserved', 5, 'Room Type 6') }}
                    {{ option('room_type_reserved', 6, 'Room Type 7') }}
                </select>
            </div>

            <button type="submit">Predict</button>

        </form>

        {% if prediction is not none %}
            <div class="result" role="status">
                {% if prediction == 0 %}
                    <p>Prediction: Likely to cancel</p>
                {% else %}
                    <p>Prediction: Likely to keep the reservation</p>
                {% endif %}
            </div>
        {% endif %}
    </div>
</body>
</html>
