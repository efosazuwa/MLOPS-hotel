data_ingestion:
  bucket_name: "efosa-hotel-data"
  bucket_file_name: "hotel_reservations.csv"
  train_size: 0.8

data_processing:
  drop_columns:
    - 'Unnamed: 0'
    - Booking_ID
  categorical_columns:
    - type_of_meal_plan
    - required_car_parking_space
    - room_type_reserved
    - market_segment_type
    - repeated_guest
    - booking_status
  numerical_columns:
    - arrival_date
    - arrival_month
    - arrival_year
    - avg_price_per_room
    - lead_time
    - no_of_adults
    - no_of_children
    - no_of_previous_bookings_not_canceled
    - no_of_previous_cancellations
    - no_of_special_requests
    - no_of_week_nights
    - no_of_weekend_nights
  skew_threshold: 5
  random_state: 30